name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Outside the checkout, so the PR under review can't change them. Each
      # tool only touches Claude's own threads on this PR
      - name: Prepare review thread tools
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          tools="$RUNNER_TEMP/review-tools"
          mkdir -p "$tools"
          cat > "$tools/unresolved-threads" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          gh api graphql \
            -f query='query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      comments(first: 1) {
                        nodes { author { login } path line body }
                      }
                    }
                  }
                }
              }
            }' \
            -f owner=__OWNER__ -f name=__NAME__ -F pr=__PR__ \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[]
              | select((.isResolved | not)
                and .comments.nodes[0].author.login == "claude")
              | {id} + (.comments.nodes[0] | {path, line, body})'
          EOF
          cat > "$tools/resolve-thread" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          id=$1
          owner=$(gh api graphql \
            -f query='query($id: ID!) {
              node(id: $id) {
                ... on PullRequestReviewThread {
                  pullRequest { number repository { nameWithOwner } }
                  comments(first: 1) { nodes { author { login } } }
                }
              }
            }' \
            -f id="$id" \
            --jq '.data.node | [
              .pullRequest.repository.nameWithOwner,
              .pullRequest.number,
              .comments.nodes[0].author.login
            ] | join(" ")')
          if [ "$owner" != "__OWNER__/__NAME__ __PR__ claude" ]; then
            echo "Not a Claude thread on this PR: $owner" >&2
            exit 1
          fi
          gh api graphql \
            -f query='mutation($id: ID!) {
              resolveReviewThread(input: { threadId: $id }) {
                thread { isResolved }
              }
            }' \
            -f id="$id" \
            --jq .data.resolveReviewThread.thread.isResolved
          EOF
          sed -i "s/__OWNER__/$OWNER/g; s/__NAME__/$NAME/g; s/__PR__/$PR/g" \
            "$tools"/*
          chmod +x "$tools"/*

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # Headless runs exit when the main agent ends its turn, dropping
          # background agents
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            Follow every step of the skill, including launching the review and validation agents, regardless of the PR size.
            If you already reviewed this PR, don't stop at step 1. Review it again, check whether your earlier findings are fixed, and post a new review.
            Before posting, run `${{ runner.temp }}/review-tools/unresolved-threads` to list your open review threads, and run `${{ runner.temp }}/review-tools/resolve-thread <id>` for each one whose finding is fixed.
            Post the result as a review instead of a comment. If no issues were found, run `gh pr review ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --approve` with the summary as the body. If issues were found, post the inline comments, then run `gh pr review ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --request-changes` with a short summary as the body.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr review:*),Bash(${{ runner.temp }}/review-tools/unresolved-threads),Bash(${{ runner.temp }}/review-tools/resolve-thread:*)"'
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

