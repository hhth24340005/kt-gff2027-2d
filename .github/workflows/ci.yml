name: ci

on:
  push:
  pull_request:

jobs:
  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ktlint

  detekt:
    name: detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew detekt

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # No display on the Linux runner
            sdl-video-driver: offscreen
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEO_DRIVER: ${{ matrix.sdl-video-driver }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # No GPU on the Linux runner, so shaders compile on lavapipe
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: ./gradlew allTests

  healthcheck:
    name: healthcheck (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            launcher: ./app/build/jpackage/image/kt-gff2027-2d/bin/HealthCheck
          - os: macos-latest
            launcher: ./app/build/jpackage/image/kt-gff2027-2d.app/Contents/MacOS/HealthCheck
          - os: windows-latest
            launcher: ./app/build/jpackage/image/kt-gff2027-2d/HealthCheck.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:jpackage -Phealthcheck
      - run: ${{ matrix.launcher }}
